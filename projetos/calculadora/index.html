<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora</title>
  <link rel="stylesheet" href="../../assets/css/styles.css" />
</head>
<body>
  <main class="container hero" style="padding-top:40px;">
    <span class="badge">Projeto 3</span>
    <h1>Calculadora</h1>
    <p class="lead">Calculadora simples com operações básicas para treinar lógica e interface.</p>

    <div class="panel">
      <input id="a" type="number" placeholder="Número 1" />
      <input id="b" type="number" placeholder="Número 2" />
      <div class="actions">
        <button class="btn primary" onclick="calc('+')">Somar</button>
        <button class="btn secondary" onclick="calc('-')">Subtrair</button>
        <button class="btn secondary" onclick="calc('*')">Multiplicar</button>
        <button class="btn secondary" onclick="calc('/')">Dividir</button>
      </div>
      <div class="tool-output" id="result">Resultado aparecerá aqui.</div>
    </div>
  </main>

  <script>
    function calc(op) {
      const a = Number(document.getElementById('a').value);
      const b = Number(document.getElementById('b').value);
      const result = document.getElementById('result');
      if (Number.isNaN(a) || Number.isNaN(b)) {
        result.textContent = 'Digite dois números válidos.';
        return;
      }
      let value;
      if (op === '+') value = a + b;
      if (op === '-') value = a - b;
      if (op === '*') value = a * b;
      if (op === '/') value = b === 0 ? 'Divisão por zero não permitida.' : a / b;
      result.textContent = `Resultado: ${value}`;
    }
  </script>
</body>
</html>
